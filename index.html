<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF7F5">
<meta name="description" content="임신 주수에 맞춰 집에서 하루 15~30분. 통증 완화 운동까지.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="맘핏">
<meta name="format-detection" content="telephone=no">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%236D4FA8'/%3E%3Cpath d='M22 44V22l10 12 10-12v22' fill='none' stroke='white' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<title>맘핏 — 임산부 홈트</title>
<style>
/* ═══════════════ 디자인 토큰 ═══════════════ */
:root{
  --bg:#FAF7F5; --surface:#FFFFFF; --surface-2:#F4F0ED;
  --ink:#241F2B; --ink-2:#544C61; --sub:#71697D; --line:#EDE7E3;   /* sub: 모든 표면에서 4.5:1 이상 */

  --primary:#6D4FA8; --primary-press:#5B3F93; --primary-soft:#F1EDFB; --primary-ink:#4A3378;
  /* 액센트는 한 색에 역할 하나만 준다. 겹치면 "잘하고 있어요"와 "여기 아프죠"가 같은 색이 된다.
     coral  = 아직 안 풀린 것 (인체도 통증 마커, 통증 완화 루틴, 오늘 아직 안 함, 타이머 막바지, 동작 큐)
     mint   = 끝난 것         (done, 주간 목표 달성, 마침 화면)
     primary= 브랜드·성취     (기본 액션, 연속 기록 뱃지, 달력에서 운동한 날)
     warn   = 주의 안내        danger = 병원 먼저 (ACOG 경고) — 이 둘은 안전 정보 전용이다 */
  --coral:#C05648; --coral-soft:#FCEBE7; --coral-ink:#96402F;
  --mint:#E4F1EC; --mint-ink:#286B58;
  --warn-bg:#FFF5E6; --warn-ink:#835410;
  --danger-bg:#FDEBE9; --danger-ink:#A0362E;

  --r-lg:22px; --r-md:16px; --r-sm:12px; --r-xs:10px;
  --sh-1:0 1px 2px rgba(36,31,43,.04), 0 2px 8px rgba(36,31,43,.045);
  --sh-2:0 2px 4px rgba(36,31,43,.04), 0 10px 28px rgba(36,31,43,.075);
  --sh-3:0 4px 10px rgba(36,31,43,.06), 0 20px 50px rgba(36,31,43,.14);

  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
  --tabh:66px; --safe:env(safe-area-inset-bottom,0px); --safet:env(safe-area-inset-top,0px);
  --ease:cubic-bezier(.2,0,0,1);
  --spring:cubic-bezier(.22,1,.28,1);
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
button,a,.card,.plan,.rowbtn{touch-action:manipulation}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);
  font-family:'Pretendard','Pretendard Variable',-apple-system,BlinkMacSystemFont,'Segoe UI','Malgun Gothic',sans-serif;
  font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  font-variant-numeric:tabular-nums;text-wrap:pretty;min-height:100dvh}
h1,h2,h3{text-wrap:balance;letter-spacing:-.025em;line-height:1.3}
button{font:inherit;border:0;background:none;color:inherit;cursor:pointer;text-align:left}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px;border-radius:6px}
#app{max-width:520px;margin:0 auto;padding-bottom:calc(var(--tabh) + var(--safe) + 12px)}

/* ═══════════════ 공통 ═══════════════ */
.page{display:none;padding:0 var(--s4) var(--s5)}
.page.on{display:block;animation:pagein .32s var(--ease) both}
@keyframes pagein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.hd{padding:calc(var(--s5) + var(--safet)) 0 var(--s4)}
.hd.row{display:flex;align-items:center;justify-content:space-between;gap:var(--s3)}
.hd.row>div{min-width:0}
.hd h2{font-size:26px;font-weight:700}
.hd p{font-size:14px;color:var(--sub);margin-top:2px}
.streak{display:flex;align-items:center;gap:5px;flex:none;background:var(--primary-soft);color:var(--primary-ink);
  font-size:13px;font-weight:700;padding:8px 13px;border-radius:999px;animation:pop .5s var(--spring) both .25s}
.streak svg{width:15px;height:15px;stroke-width:2.1}
@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
.sect{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s3);
  margin:var(--s5) 0 var(--s3)}
.sect h3{font-size:17px;font-weight:700}
.sect span{font-size:13px;color:var(--sub);flex:none}

.tag{display:inline-block;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;
  line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag.pri{background:var(--primary-soft);color:var(--primary-ink)}
.tag.cor{background:var(--coral-soft);color:var(--coral-ink)}
.tag.min{background:var(--mint);color:var(--mint-ink)}
.tags{display:flex;gap:6px;flex-wrap:wrap}

.btn{display:flex;align-items:center;justify-content:center;gap:var(--s2);width:100%;min-height:54px;
  border-radius:var(--r-md);padding:15px var(--s4);background:var(--primary);color:#fff;
  font-size:16.5px;font-weight:700;box-shadow:var(--sh-1);
  transition-property:transform,background-color,box-shadow;transition-duration:.16s;transition-timing-function:var(--ease)}
.btn:active{transform:scale(.96);background:var(--primary-press)}
.btn.sec{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line),var(--sh-1)}
.btn.sec:active{background:var(--surface-2)}
.btn svg{width:20px;height:20px;flex:none}

.icon-btn{display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;
  background:var(--surface);box-shadow:var(--sh-1);flex:none;
  transition:transform .16s var(--ease),background-color .16s var(--ease)}
.icon-btn:active{transform:scale(.96);background:var(--surface-2)}
.icon-btn svg{width:21px;height:21px}
svg.ic{stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* 진입 스태거 */
.stg>*{animation:rise .42s var(--ease) both}
.stg.col{display:flex;flex-direction:column;gap:var(--s3)}
.stg>*:nth-child(1){animation-delay:.02s} .stg>*:nth-child(2){animation-delay:.06s}
.stg>*:nth-child(3){animation-delay:.1s} .stg>*:nth-child(4){animation-delay:.14s}
.stg>*:nth-child(5){animation-delay:.18s} .stg>*:nth-child(n+6){animation-delay:.22s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ═══════════════ 온보딩 ═══════════════ */
#onb{position:fixed;inset:0;background:var(--bg);z-index:80;overflow-y:auto;display:none}
#onb.on{display:block}
.ob{max-width:520px;margin:0 auto;padding:var(--s6) var(--s5) var(--s5);
  min-height:100dvh;display:flex;flex-direction:column}
.ob-art{width:min(268px,72vw);margin:0 auto var(--s3)}
.ob-art svg{width:100%;height:auto;display:block}
.ob h1{font-size:34px;font-weight:700;color:var(--primary);letter-spacing:-.04em}
.ob .lead{font-size:16px;color:var(--ink-2);margin:var(--s2) 0 var(--s6);line-height:1.7}
.fld label{display:block;font-size:14.5px;font-weight:700;margin-bottom:var(--s2)}
.fld input{width:100%;min-height:56px;padding:15px var(--s4);border-radius:var(--r-md);
  border:1.5px solid var(--line);background:var(--surface);font:inherit;font-size:16px;color:var(--ink)}
.fld input:focus{outline:0;border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-soft)}
.fld .help{font-size:13px;color:var(--sub);margin-top:var(--s2)}
.fld .err{font-size:13.5px;color:var(--danger-ink);margin-top:var(--s2);display:none;font-weight:600}
.fld.bad input{border-color:var(--danger-ink)}
.fld.bad .err{display:block}
.note{display:flex;gap:var(--s3);background:var(--warn-bg);color:var(--warn-ink);
  border-radius:var(--r-md);padding:var(--s4);margin:var(--s5) 0;font-size:13.5px;line-height:1.7}
.note svg{width:20px;height:20px;flex:none;margin-top:2px}
.note b{display:block;margin-bottom:3px;font-size:14px}

/* ═══════════════ 홈 ═══════════════ */
.wk{position:relative;overflow:hidden;background:linear-gradient(135deg,#6D4FA8 0%,#7C52B6 55%,#8C55C3 100%);
  color:#fff;border-radius:var(--r-lg);padding:var(--s4) var(--s5);box-shadow:var(--sh-2)}
.wk::after{content:"";position:absolute;right:-46px;top:-56px;width:160px;height:160px;
  border-radius:50%;background:#ffffff1c}
.wk .top{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap;position:relative}
.wk .w{font-size:23px;font-weight:800;letter-spacing:-.035em}
.wk .ph{font-size:12.5px;font-weight:700;background:#00000033;padding:4px 11px;border-radius:999px}
.wk .bar{height:7px;background:#ffffff33;border-radius:999px;margin-top:var(--s3);overflow:hidden;position:relative}
.wk .bar i{display:block;height:100%;background:#fff;border-radius:999px;
  transition:width .6s var(--ease)}
.wk .meta{display:flex;justify-content:space-between;gap:var(--s3);font-size:12.5px;
  margin-top:var(--s2);color:#ffffffeb;position:relative}

.seg{display:flex;gap:var(--s2);background:var(--surface);padding:5px;border-radius:var(--r-md);
  box-shadow:var(--sh-1)}
.seg button{flex:1;min-height:46px;border-radius:var(--r-sm);font-size:15px;font-weight:700;
  color:var(--sub);display:flex;align-items:center;justify-content:center;
  transition:background-color .18s var(--ease),color .18s var(--ease),transform .16s var(--ease)}
.seg button:active{transform:scale(.96)}
.seg button[aria-pressed="true"]{background:var(--primary);color:#fff}

/* 상황 타일 — "지금 왜 운동하나" */
.moods{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s2)}
.mood{display:flex;align-items:center;gap:var(--s3);min-height:74px;background:var(--surface);
  border-radius:var(--r-md);padding:var(--s3);box-shadow:var(--sh-1);
  transition:transform .16s var(--ease),box-shadow .16s var(--ease)}
.mood:active{transform:scale(.97);box-shadow:var(--sh-2)}
.mood .ci{width:38px;height:38px;border-radius:var(--r-xs);display:flex;align-items:center;
  justify-content:center;flex:none}
.mood .ci svg{width:20px;height:20px}
.mood .tx{min-width:0}
.mood b{display:block;font-size:14.5px;font-weight:700;letter-spacing:-.025em}
.mood .tx span{display:block;font-size:12px;color:var(--sub);line-height:1.4}

/* 부위별 루틴 — 화면 끝까지 흐르는 가로 스크롤 */
.plans{display:flex;gap:var(--s3);overflow-x:auto;scroll-snap-type:x proximity;
  margin:0 calc(var(--s4) * -1);padding:2px var(--s4) var(--s2);
  scrollbar-width:none;-ms-overflow-style:none}
.plans::-webkit-scrollbar{display:none}
.plan{flex:none;width:60%;max-width:212px;scroll-snap-align:start;
  background:var(--surface);border-radius:var(--r-lg);padding:var(--s3) var(--s3) var(--s4);
  box-shadow:var(--sh-1);display:flex;flex-direction:column;gap:var(--s2);
  transition:transform .16s var(--ease),box-shadow .16s var(--ease)}
.plan:active{transform:scale(.97);box-shadow:var(--sh-2)}
.plan .pic{position:relative;display:block;border-radius:var(--r-sm);overflow:hidden;
  aspect-ratio:5/4;min-height:0;background:var(--surface-2)}
.plan .pic svg{position:absolute;top:6%;left:5%;width:90%;height:88%;display:block}
.plan b{font-size:15.5px;font-weight:700;letter-spacing:-.02em}
.plan .sb{font-size:12.5px;color:var(--sub);line-height:1.45}
.plan .mt{font-size:12.5px;font-weight:700;color:var(--primary-ink);margin-top:auto}
.plan.p-cor .pic{background:var(--coral-soft)} .plan.p-cor .mt{color:var(--coral-ink)}
.plan.p-min .pic{background:var(--mint)} .plan.p-min .mt{color:var(--mint-ink)}
.plan.p-pri .pic{background:var(--primary-soft)}

.rowbtn{display:flex;align-items:center;gap:var(--s3);width:100%;min-height:56px;
  background:var(--surface);border-radius:var(--r-md);padding:var(--s3) var(--s4);box-shadow:var(--sh-1);
  transition:transform .16s var(--ease)}
.rowbtn:active{transform:scale(.98)}
.rowbtn .ci{width:36px;height:36px;border-radius:var(--r-xs);display:flex;align-items:center;
  justify-content:center;flex:none}
.rowbtn .ci svg{width:19px;height:19px}
.rowbtn .tx{flex:1;min-width:0}
.rowbtn .tx b{display:block;font-size:14.5px;font-weight:700}
.rowbtn .tx span{display:block;font-size:12.5px;color:var(--sub);line-height:1.45}
.rowbtn>svg:last-child{width:18px;height:18px;color:var(--sub);flex:none}
.ci.dg{background:var(--danger-bg);color:var(--danger-ink)}
.ci.pr{background:var(--primary-soft);color:var(--primary-ink)}
.ci.cr{background:var(--coral-soft);color:var(--coral-ink)}
.ci.mn{background:var(--mint);color:var(--mint-ink)}

.done{display:flex;align-items:center;gap:var(--s3);background:var(--mint);color:var(--mint-ink);
  border-radius:var(--r-md);padding:var(--s4);font-size:14.5px;font-weight:700}
.done svg{width:22px;height:22px;flex:none}

/* ═══════════════ 목록 ═══════════════ */
.chips{display:flex;gap:var(--s2);overflow-x:auto;padding:2px 0 var(--s3);
  scrollbar-width:none;-ms-overflow-style:none;scroll-snap-type:x proximity}
.chips button{scroll-snap-align:start}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;min-height:40px;padding:8px 15px;border-radius:999px;background:var(--surface);
  font-size:13.5px;font-weight:600;color:var(--ink-2);box-shadow:inset 0 0 0 1.5px var(--line);
  transition:background-color .18s var(--ease),color .18s var(--ease),box-shadow .18s var(--ease),transform .16s var(--ease)}
.chips button:active{transform:scale(.96)}
.chips button[aria-pressed="true"]{background:var(--ink);color:#fff;box-shadow:none}

.tagd{font-size:13.5px;color:var(--ink-2);line-height:1.65;background:var(--surface);
  border-radius:var(--r-md);padding:var(--s3) var(--s4);margin-bottom:var(--s2);box-shadow:var(--sh-1)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s3)}
.card{background:var(--surface);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--sh-1);
  display:flex;flex-direction:column;transition:transform .16s var(--ease),box-shadow .16s var(--ease)}
.card:active{transform:scale(.97);box-shadow:var(--sh-2)}
/* 카드 안 여백 — 동심원 라운드(바깥 22 = 안 14 + 패딩 8) */
.card .pic{position:relative;display:block;aspect-ratio:5/4;min-height:0;overflow:hidden;
  margin:var(--s2) var(--s2) 0;border-radius:14px;
  background:linear-gradient(170deg,#F7F1FB,#FBEDE9)}
/* inset + height:auto 는 SVG의 고유 비율로 계산돼 아래로 넘친다. 폭·높이를 직접 준다 */
.card .pic svg{position:absolute;top:7%;left:6%;width:88%;height:86%;display:block}
.card .bd{padding:var(--s3);display:flex;flex-direction:column;gap:7px;flex:1}
.card .bd b{font-size:14.5px;font-weight:700;letter-spacing:-.02em}
.card .bd .mt{font-size:12.5px;color:var(--sub)}
/* 태그 2개를 같은 폭으로 한 줄에 — 카드 높이도 같이 맞는다 */
.card .tags{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px;margin-top:auto}
.card .tag{text-align:center;padding:4px 6px}
.empty{grid-column:1/-1;text-align:center;color:var(--sub);font-size:14.5px;padding:var(--s7) var(--s4);
  background:var(--surface);border-radius:var(--r-lg);line-height:1.7}

/* ═══════════════ 케어 ═══════════════ */
/* 인체도 — 부위를 눌러 아픈 곳·불편한 곳을 고른다 */
.bodymap{max-width:250px;margin:0 auto;padding:var(--s2) 0}
.bodymap svg{width:100%;height:auto;display:block;overflow:visible}
/* 부위 경계가 눌러보기 전에도 보이게 옅게 깔아둔다 */
.hot>*{fill:rgba(109,79,168,.05);stroke:rgba(109,79,168,.22);stroke-width:1;cursor:pointer;
  transition:fill .18s var(--ease),stroke .18s var(--ease)}
.hot:active>*{fill:rgba(109,79,168,.2)}
.hot:focus-visible{outline:none}
.hot:focus-visible>*{fill:rgba(109,79,168,.16);stroke:var(--primary);stroke-width:2}
.hot.mk>*{fill:rgba(192,86,72,.14);stroke:var(--coral);stroke-width:1.6}
.hot.sel>*{fill:rgba(109,79,168,.26);stroke:var(--primary);stroke-width:2}
@media (hover:hover){.hot:hover>*{fill:rgba(109,79,168,.14)}}

.panel{background:var(--surface);border-radius:var(--r-lg);padding:var(--s4);box-shadow:var(--sh-1);
  margin-top:var(--s3);animation:rise .3s var(--ease) both}
.panel .rowbtn{background:var(--bg);box-shadow:none}
.panel .avoid button{background:var(--bg)}
.phd{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);margin-bottom:var(--s2)}
.phd h3{font-size:17.5px;font-weight:800;letter-spacing:-.025em}
.lnk{display:flex;align-items:center;justify-content:center;width:40px;height:40px;margin:-8px -8px -8px 0;
  color:var(--sub);flex:none}
.lnk svg{width:18px;height:18px}
.plab{font-size:12.5px;font-weight:700;color:var(--sub);margin:var(--s3) 0 6px}
.panel>.plab:first-of-type{margin-top:0}
/* 한 줄 행 — 부위 안에서는 설명 없이 이름만 */
.crow{display:flex;align-items:center;gap:var(--s2);width:100%;min-height:46px;
  font-size:14.5px;font-weight:700;transition:opacity .16s var(--ease)}
.crow:active{opacity:.55}
.crow+.crow{border-top:1px solid var(--line)}
.crow .ci{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;
  justify-content:center;flex:none}
.crow .ci svg{width:15px;height:15px}
.crow b{flex:1;min-width:0}
.crow>svg:last-child{width:17px;height:17px;color:var(--sub);flex:none}
.hint{text-align:center;font-size:13.5px;color:var(--sub);line-height:1.7;padding:var(--s4) var(--s3);
  background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--sh-1);margin-top:var(--s3)}
.panel .hint{background:none;box-shadow:none;margin:0;padding:6px 0 2px;text-align:left}

.tabs2{display:flex;gap:var(--s2);background:var(--surface);padding:5px;border-radius:var(--r-md);
  box-shadow:var(--sh-1);margin-bottom:var(--s4)}
.tabs2 button{flex:1;min-height:46px;border-radius:var(--r-sm);font-size:14.5px;font-weight:700;
  color:var(--sub);display:flex;align-items:center;justify-content:center;
  transition:background-color .18s var(--ease),color .18s var(--ease)}
.tabs2 button[aria-pressed="true"]{background:var(--ink);color:#fff}
.lead-p{font-size:14px;color:var(--ink-2);line-height:1.7;margin-bottom:var(--s4)}
.stack{display:flex;flex-direction:column;gap:var(--s2)}
.avoid{display:flex;flex-wrap:wrap;gap:var(--s2)}
.avoid button{display:flex;align-items:center;gap:var(--s2);min-height:48px;padding:10px var(--s4);
  border-radius:999px;background:var(--surface);font-size:14px;font-weight:600;color:var(--ink-2);
  box-shadow:inset 0 0 0 1.5px var(--line);
  transition:background-color .18s var(--ease),color .18s var(--ease),box-shadow .18s var(--ease),transform .16s var(--ease)}
.avoid button:active{transform:scale(.96)}
.avoid button[aria-pressed="true"]{background:var(--primary);color:#fff;box-shadow:none}
.avoid button svg{width:17px;height:17px;flex:none}
.info{display:flex;gap:var(--s3);background:var(--primary-soft);color:var(--primary-ink);
  border-radius:var(--r-md);padding:var(--s4);font-size:13.5px;line-height:1.7;margin-top:var(--s4)}
.info svg{width:19px;height:19px;flex:none;margin-top:2px}

/* ═══════════════ 기록 ═══════════════ */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s2)}
.stat{background:var(--surface);border-radius:var(--r-md);padding:13px var(--s2) 12px;text-align:center;
  box-shadow:var(--sh-1)}
.stat b{display:block;font-size:23px;font-weight:800;letter-spacing:-.035em;line-height:1.25}
.stat span{font-size:12px;color:var(--sub);display:block;margin-top:1px}
/* 이번 주 — ACOG 150분 대비 + 요일별 막대 */
.wkgoal{background:var(--surface);border-radius:var(--r-lg);padding:var(--s4);box-shadow:var(--sh-1)}
.wkgoal .hdr{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s2);
  margin-bottom:var(--s2)}
.wkgoal .hdr b{font-size:16.5px;font-weight:800;letter-spacing:-.025em;flex:none}
.wkgoal .num{font-size:13px;font-weight:700;color:var(--primary-ink);text-align:right;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wkgoal .num.hit{background:var(--mint);color:var(--mint-ink);padding:3px 9px;border-radius:999px;
  font-size:12px}
.gbar{height:8px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.gbar i{display:block;height:100%;border-radius:999px;
  background:linear-gradient(90deg,var(--primary),#9C80D6);transition:width .6s var(--ease)}
/* 요일 칸 = 이번 주 기록. 한 날은 분 수를 그대로 보여준다 */
/* 바깥 카드 22px - 패딩 16px = 안쪽 6~8px (동심원) */
/* minmax(0,1fr) — 값이 있는 칸이 제 몫보다 넓어져 빈 칸을 밀어내던 문제 */
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin:var(--s3) 0 var(--s4)}
.day{height:44px;border-radius:8px;background:var(--bg);display:flex;flex-direction:column;
  align-items:center;justify-content:center;line-height:1.05}
.day b{font-size:14.5px;font-weight:800;letter-spacing:-.05em;color:var(--sub)}
.day b.sm{font-size:12.5px;letter-spacing:-.06em}   /* 세 자리(100분 이상) */
.day span{font-size:12px;margin-top:1px;transform:scale(.86);transform-origin:top center}
.day.done{background:var(--primary)}
.day.done b{color:#fff}
.day.done span{color:#ffffffd6}
.day.miss{background:var(--surface-2)}                        /* 지나갔는데 안 한 날 */
.day.now{background:none;box-shadow:inset 0 0 0 2px var(--coral)}     /* 오늘, 아직 */
.day.todo{background:none;box-shadow:inset 0 0 0 1.5px var(--line)}   /* 아직 안 온 날 */
.days .lb{font-size:12px;color:var(--sub);text-align:center;margin-top:5px}
.fine{font-size:12.5px;color:var(--sub);line-height:1.65;margin-top:var(--s3)}

.cal{background:var(--surface);border-radius:var(--r-lg);padding:var(--s4);box-shadow:var(--sh-1)}
.cal h3{font-size:15px;margin-bottom:var(--s3)}
.calhd{display:flex;align-items:center;justify-content:space-between;gap:var(--s2);margin-bottom:var(--s3)}
.calhd h3{margin:0;flex:1;text-align:center}
.calhd .icon-btn{width:40px;height:40px;box-shadow:none;background:var(--bg)}
.calhd .icon-btn:disabled{opacity:.3}
.cg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cg i{aspect-ratio:1;border-radius:8px;background:var(--bg);display:flex;align-items:center;
  justify-content:center;font-size:12.5px;font-style:normal;color:var(--sub)}
.cg i.lb{aspect-ratio:auto;background:none;font-size:12px;font-weight:600;padding-bottom:2px}
.cg i.on{background:var(--primary);color:#fff;font-weight:700}
.cg i.td{box-shadow:inset 0 0 0 2px var(--coral);color:var(--coral-ink);font-weight:700}

/* ═══════════════ 탭바 ═══════════════ */
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:60;background:#fffffff2;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  box-shadow:0 -1px 0 var(--line);padding-bottom:var(--safe)}
.tabbar .in{max-width:520px;margin:0 auto;display:flex}
.tabbar button{flex:1;min-height:var(--tabh);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:4px;font-size:12px;font-weight:600;color:var(--sub);
  transition:color .18s var(--ease)}
.tabbar button[aria-current="page"]{color:var(--primary)}
.tabbar svg{width:23px;height:23px;transition:transform .2s var(--ease)}
.tabbar button[aria-current="page"] svg{transform:translateY(-1px) scale(1.06)}

/* ═══════════════ 오버레이 ═══════════════ */
/* 시트가 아래에서 올라오고, 닫을 때도 같은 속도로 내려간다 (display 토글은 닫힘 모션이 안 보임) */
.ov{position:fixed;inset:0;z-index:70;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;
  visibility:hidden;opacity:0;transform:translateY(26px) scale(.985);
  transition:transform .3s var(--ease),opacity .22s var(--ease),visibility 0s linear .3s}
.ov.on{visibility:visible;opacity:1;transform:none;
  transition:transform .3s var(--spring),opacity .2s var(--ease),visibility 0s}
.ov .in{max-width:520px;margin:0 auto;padding-bottom:calc(var(--s7) + var(--safe))}
.ovbar{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:var(--s3);
  padding:calc(var(--s3) + var(--safet)) var(--s4) var(--s3);background:#faf7f5f2;backdrop-filter:blur(14px)}
.ovbar h3{flex:1;min-width:0;font-size:17px;font-weight:700}
.ovbar .sp{flex:1}

/* 확인 시트 (native confirm 대체) */
.mask{position:fixed;inset:0;z-index:90;background:rgba(36,31,43,.42);
  display:flex;align-items:flex-end;justify-content:center;
  visibility:hidden;opacity:0;transition:opacity .24s var(--ease),visibility 0s linear .24s}
.mask.on{visibility:visible;opacity:1;transition-delay:0s}
.mask .sh{width:100%;max-width:520px;background:var(--surface);box-shadow:var(--sh-3);
  border-radius:var(--r-lg) var(--r-lg) 0 0;padding:var(--s5) var(--s4) calc(var(--s4) + var(--safe));
  transform:translateY(100%);transition:transform .3s var(--spring)}
.mask.on .sh{transform:none}
.mask h3{font-size:18.5px;font-weight:800;margin-bottom:5px}
.mask p{font-size:14.5px;color:var(--ink-2);line-height:1.65;margin-bottom:var(--s5)}
.mask .row{display:flex;gap:var(--s3)}
.mask .row .btn{flex:1}
.btn.dg{background:var(--danger-ink)}
.btn.dg:active{background:#8B2E27}

.stage{position:relative;margin:0 var(--s4);border-radius:var(--r-lg);overflow:hidden;
  background:linear-gradient(170deg,#F7F1FB,#FBEDE9)}
.stage svg{display:block;width:100%;height:auto}
.cue{position:absolute;left:var(--s4);right:var(--s4);bottom:var(--s3);text-align:center;
  font-size:14.5px;font-weight:700;color:var(--coral-ink);min-height:1.6em}
.cue span{position:absolute;left:0;right:0;opacity:0;animation:cuef var(--dur,8s) infinite}
.cue span:nth-child(2){animation-delay:calc(var(--dur,8s)/2)}
@keyframes cuef{0%,3%{opacity:0}9%,45%{opacity:1}53%,100%{opacity:0}}

.dt{padding:var(--s5) var(--s4) 0}
.dt h1{font-size:25px;font-weight:700;margin:var(--s3) 0 3px}
.dt .en{font-size:13.5px;color:var(--sub);margin-bottom:var(--s4)}
.box{background:var(--surface);border-radius:var(--r-md);padding:var(--s4);margin-bottom:var(--s3);
  box-shadow:var(--sh-1)}
.box>b{display:block;font-size:13.5px;font-weight:700;color:var(--primary-ink);margin-bottom:var(--s2)}
.box li{list-style:none;font-size:14.5px;line-height:1.7;padding-left:22px;position:relative;
  color:var(--ink-2)}
.box li+li{margin-top:2px}
.box li::before{content:"";position:absolute;left:5px;top:11px;width:6px;height:6px;border-radius:50%;
  background:var(--primary)}
.steps{margin-bottom:var(--s3)}
.stp{display:flex;gap:var(--s3);padding:var(--s3) 0;font-size:14.5px;line-height:1.65;color:var(--ink-2)}
.stp+.stp{border-top:1px solid var(--line)}
.stp .n{flex:none;width:24px;height:24px;border-radius:50%;background:var(--primary-soft);
  color:var(--primary-ink);font-size:12px;font-weight:700;display:flex;align-items:center;
  justify-content:center;margin-top:1px}
.caut{display:flex;gap:var(--s3);background:var(--warn-bg);color:var(--warn-ink);border-radius:var(--r-md);
  padding:var(--s4);font-size:13.5px;line-height:1.7;margin-bottom:var(--s4)}
.caut svg{width:19px;height:19px;flex:none;margin-top:2px}
.caut b{display:block;margin-bottom:2px}
.warn{display:flex;gap:var(--s3);background:var(--danger-bg);color:var(--danger-ink);
  border-radius:var(--r-md);padding:var(--s4);font-size:13.5px;line-height:1.7;margin-bottom:var(--s4)}
.warn svg{width:20px;height:20px;flex:none;margin-top:2px}
.warn b{display:block;margin-bottom:3px;font-size:14px}
.cta{padding:var(--s2) var(--s4) 0}
/* 시작 버튼은 스크롤해도 하단에 붙어 있는다 */
.cta.stick{position:sticky;bottom:0;z-index:2;margin-top:var(--s4);
  padding:var(--s4) var(--s4) calc(var(--s3) + var(--safe));
  background:linear-gradient(to top,var(--bg) 58%,rgba(250,247,245,0))}
#b-routine,#b-pain,#b-detail{padding-bottom:0}
/* 통증 상세 안내 — 정보는 그대로 두고 밀도만 높인다 */
.mini{display:flex;gap:var(--s3);border-radius:var(--r-md);padding:var(--s3) var(--s4);
  font-size:13px;line-height:1.6;margin-bottom:var(--s2)}
.mini svg{width:18px;height:18px;flex:none;margin-top:2px}
.mini b{display:block;font-size:13.5px;margin-bottom:2px}
.mini.dg{background:var(--danger-bg);color:var(--danger-ink)}
.mini.mn{background:var(--mint);color:var(--mint-ink)}
.mini.pr{background:var(--primary-soft);color:var(--primary-ink)}

/* 루틴 시트 */
.rlist{padding:0 var(--s4)}
.ritem{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) 0}
.ritem+.ritem{border-top:1px solid var(--line)}
.ritem .th{position:relative;display:block;width:58px;height:58px;border-radius:var(--r-sm);
  overflow:hidden;flex:none;background:linear-gradient(170deg,#F7F1FB,#FBEDE9)}
.ritem .th svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.ritem .tx{flex:1;min-width:0}
.ritem .tx b{display:block;font-size:15px;font-weight:700}
.ritem .tx span{display:block;font-size:12.5px;color:var(--sub)}
.ritem .no{font-size:12.5px;font-weight:700;color:var(--sub);flex:none}

/* 플레이어 */
.ptop{display:flex;align-items:center;gap:var(--s3);padding:calc(var(--s3) + var(--safet)) var(--s4) var(--s3);
  position:sticky;top:0;z-index:3;background:#faf7f5f2;backdrop-filter:blur(14px)}
.ptop .pb{flex:1;height:7px;background:var(--line);border-radius:999px;overflow:hidden}
.ptop .pb i{display:block;height:100%;background:var(--primary);border-radius:999px;
  transition:width .5s var(--spring)}
.ptop .pc{font-size:13px;font-weight:700;color:var(--sub);flex:none;min-width:38px;text-align:center}
.pnm{text-align:center;padding:var(--s4) var(--s4) 0}
.pnm h1{font-size:25px;font-weight:700}
.pnm p{font-size:13.5px;color:var(--sub);margin-top:3px}

/* 링 타이머 — 남은 시간이 원으로 줄어든다 */
.ring{position:relative;width:min(214px,58vw);aspect-ratio:1;margin:var(--s4) auto 0}
.ring>svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.ring circle{fill:none;stroke-width:8;stroke-linecap:round}
.ring .tr{stroke:var(--line)}
.ring .bar{stroke:var(--primary);transition:stroke-dashoffset .98s linear,stroke .3s var(--ease)}
.ring .cn{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .t{font-size:46px;font-weight:800;letter-spacing:-.045em;line-height:1.15;font-variant-numeric:tabular-nums;
  transition:color .3s var(--ease)}
.ring .l{font-size:12.5px;color:var(--sub);font-weight:700;margin-top:2px}
.ring.pz .bar{stroke:var(--sub)} .ring.pz .t{color:var(--sub)}
.ring.hot .bar{stroke:var(--coral)} .ring.hot .t{color:var(--coral-ink);animation:tick .95s var(--ease) infinite}
@keyframes tick{0%,70%{transform:none}35%{transform:scale(1.09)}}

.pctl{display:flex;align-items:center;gap:var(--s3);padding:var(--s5) var(--s4) 0}
.pctl .btn{flex:1}
.pctl .icon-btn{width:52px;height:52px;box-shadow:inset 0 0 0 1.5px var(--line),var(--sh-1)}
.pctl .icon-btn:disabled{opacity:.35}

/* 다음 동작 준비 화면 — 세로 가운데 */
.restwrap{min-height:calc(100dvh - 78px - var(--safet));display:flex;flex-direction:column;justify-content:center}
.rest{text-align:center;padding:0 var(--s4)}
.rest .up{font-size:13px;font-weight:700;color:var(--primary-ink);background:var(--primary-soft);
  display:inline-block;padding:6px 14px;border-radius:999px}
.rest h1{font-size:27px;font-weight:800;margin-top:var(--s3)}
.rest .sub{font-size:14px;color:var(--sub);margin-top:4px}
.rest .th{position:relative;display:block;width:min(240px,64vw);aspect-ratio:5/4;margin:var(--s5) auto 0;
  border-radius:var(--r-lg);overflow:hidden;background:linear-gradient(170deg,#F7F1FB,#FBEDE9)}
.rest .th svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.rest .cd{font-size:64px;font-weight:800;letter-spacing:-.05em;line-height:1.1;margin-top:var(--s4);
  font-variant-numeric:tabular-nums;color:var(--primary)}
.rest .cd.hot{color:var(--coral-ink)}

/* 완료 */
.fin{text-align:center;padding:var(--s6) var(--s5) var(--s7);
  min-height:calc(100dvh - var(--safet));display:flex;flex-direction:column;justify-content:center}
.fin .em{position:relative;width:92px;height:92px;margin:0 auto var(--s5);border-radius:50%;background:var(--mint);
  color:var(--mint-ink);display:flex;align-items:center;justify-content:center;
  animation:pop .55s var(--spring) both}
.fin .em::before,.fin .em::after{content:"";position:absolute;inset:0;border-radius:50%;
  border:2px solid var(--mint-ink);opacity:0;animation:ripple 2.4s var(--ease) infinite}
.fin .em::after{animation-delay:.8s}
@keyframes ripple{0%{transform:scale(1);opacity:.3}70%{transform:scale(1.6);opacity:0}100%{opacity:0}}
.fin .em svg{width:44px;height:44px;stroke-width:2.6;stroke-dasharray:30;stroke-dashoffset:30;
  animation:draw .5s var(--ease) .22s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.fin h1{font-size:28px;font-weight:800;margin-bottom:var(--s2);animation:rise .45s var(--ease) both .3s}
.fin p{font-size:15px;color:var(--ink-2);line-height:1.7;animation:rise .45s var(--ease) both .38s}
.fin .sum{display:flex;gap:var(--s2);margin:var(--s5) 0 var(--s6);animation:rise .45s var(--ease) both .46s}
.fin .sum div{flex:1;background:var(--surface);border-radius:var(--r-md);padding:var(--s4) var(--s2);
  box-shadow:var(--sh-1)}
.fin .sum b{display:block;font-size:24px;font-weight:800;letter-spacing:-.03em}
.fin .sum span{font-size:12px;color:var(--sub)}
.fin .cta2{display:flex;flex-direction:column;gap:var(--s2);animation:rise .45s var(--ease) both .54s}

/* 안전 정보 */
.sf{padding:0 var(--s4)}
.sf h4{font-size:16px;font-weight:700;margin:var(--s5) 0 var(--s2)}
.sf ul{padding-left:20px;margin:0}
.sf li{font-size:14.5px;line-height:1.8;color:var(--ink-2)}
.sf .src{font-size:12.5px;color:var(--sub);line-height:1.75;margin-top:var(--s5);
  padding-top:var(--s4);border-top:1px solid var(--line)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;
    transition-duration:.01ms !important}
}
</style>
</head>
<body>

<div id="app">
  <section class="page on" id="p-home" aria-labelledby="h-home"></section>
  <section class="page" id="p-lib" aria-labelledby="h-lib"></section>
  <section class="page" id="p-care" aria-labelledby="h-care"></section>
  <section class="page" id="p-log" aria-labelledby="h-log"></section>
  <nav class="tabbar" aria-label="주요 메뉴"><div class="in" id="tabbar"></div></nav>
</div>

<div id="onb" role="dialog" aria-modal="true" aria-labelledby="ob-t"></div>

<p id="live" aria-live="polite" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap"></p>

<script>
"use strict";
/* ═══════════════════════ 아이콘 (SVG · 이모지 미사용) ═══════════════════════ */
const I={

 close:'<path d="M6 6l12 12M18 6 6 18"/>',

 shield:'<path d="M12 3.6 19 6v5.4c0 4.2-2.8 7.4-7 9-4.2-1.6-7-4.8-7-9V6z"/><path d="M9 12.2l2.1 2.1 4-4.2"/>',
 filter:'<path d="M4 6.5h16M7 12h10M10 17.5h4"/>',

function beep(f,dur=.14,vol=.07){
  if(S.mute) return;
  try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended') AC.resume();
    const o=AC.createOscillator(), g=AC.createGain(), t=AC.currentTime;
    o.type='sine'; o.frequency.setValueAtTime(f,t);
    g.gain.setValueAtTime(.0001,t);
    g.gain.exponentialRampToValueAtTime(vol,t+.02);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+dur+.03);
  }catch(e){}
}

function preg(){
  if(!S.due) return null;
  const due=new Date(S.due+'T00:00:00'), now=new Date(); now.setHours(0,0,0,0);
  const leftD=Math.round((due-now)/864e5), totalD=280-leftD;
  const w=Math.max(0,Math.floor(totalD/7)), d=((totalD%7)+7)%7;
  return {w,d,leftD,phase:w<14?1:w<28?2:3,pct:Math.max(2,Math.min(100,totalD/280*100))};
}

  const seed=[...today()].reduce((a,c)=>a+c.charCodeAt(0),0);
  const out=[], cnt={warmup:0,main:0,stretch:0}; let used=0;
  const take=e=>{ out.push(e); used+=e.min; cnt[e.role]++; };
  (plan.must||[]).forEach(id=>{ const e=ok.find(x=>x.id===id); if(e&&!out.includes(e)&&used+e.min<=mins) take(e); });
  const byRole=r=>ok.filter(e=>e.role===r&&out.indexOf(e)<0)
    .map((e,i)=>({e,k:score(e)*100+((seed+i*7)%13)}))
    .sort((a,b)=>a.k-b.k).map(x=>x.e);
  for(const [r,cap] of (plan.roles||DEF_ROLES))
    for(const e of byRole(r)){ if(cnt[r]>=cap) break; if(used+e.min<=mins) take(e); }
  if(!out.length&&ok.length) take(ok[0]);   /* 제외 설정이 심해도 빈 루틴은 안 준다 */
  return out.sort((a,b)=>ROLE_ORD[a.role]-ROLE_ORD[b.role]);
}
const planMeta=(id,mins)=>{const l=buildPlan(id,mins);return{list:l,min:l.reduce((a,e)=>a+e.min,0),n:l.length}};

function renderLog(){
  const p=preg();
  const ent=Object.entries(S.done), tot=ent.reduce((a,[,v])=>a+v.min,0), streak=streakN();

  /* 이번 주 (일~토) */
  const ws=new Date(); ws.setHours(0,0,0,0); ws.setDate(ws.getDate()-ws.getDay());
  const tk=today();
  const week=Array.from({length:7},(_,i)=>{ const d=new Date(ws); d.setDate(ws.getDate()+i);
    const k=ymd(d), min=(S.done[k]||{}).min||0;
    /* done=한 날 · now=오늘 아직 · miss=지나갔는데 안 한 날 · todo=아직 안 온 날 */
    return {k,min,st:min?'done':k===tk?'now':k<tk?'miss':'todo'}; });
  const wmin=week.reduce((a,x)=>a+x.min,0), wpct=Math.min(100,wmin/GOAL*100);
  const wdays=week.filter(x=>x.min).length;
  /* 요일 칸이 곧 이번 주 기록이다 — 한 날은 분 수, 안 한 날은 상태만 */
  const bars=week.map((x,i)=>`<div>
      <div class="day ${x.st}">${x.min
        ?`<b class="${x.min>=100?'sm':''}">${x.min}</b><span>min</span>`
        :x.st==='miss'?'<b>–</b>':''}</div>
      <div class="lb">${'일월화수목금토'[i]}</div></div>`).join('');

  /* 달력 — calM 만큼 이전 달 */
  const now=new Date(), cur=new Date(now.getFullYear(),now.getMonth()+calM,1);
  const y=cur.getFullYear(), m=cur.getMonth();
  const first=new Date(y,m,1).getDay(), last=new Date(y,m+1,0).getDate();
  let cells='일월화수목금토'.split('').map(w=>`<i class="lb">${w}</i>`).join('')
    + Array(first).fill('<i class="lb"></i>').join('');
  let mdays=0;
  for(let i=1;i<=last;i++){ const k=`${y}-${pad(m+1)}-${pad(i)}`; const v=S.done[k];
    if(v) mdays++;
    cells+=`<i class="${v?'on':''} ${k===tk?'td':''}">${i}</i>`; }

  $('#p-log').innerHTML=`
    <div class="hd row">
      <div><h2 id="h-log">기록</h2><p>꾸준함이 가장 좋은 운동이에요</p></div>
      ${streak>=2?`<span class="streak">${ic('flame')}${streak}일째</span>`:''}

    ${p?weekCard(p):''}

      <div class="stat"><b>${ent.length}</b><span>총 운동일</span></div>
      <div class="stat"><b>${streak}</b><span>연속 일수</span></div>
      <div class="stat"><b>${tot}</b><span>총 시간(분)</span></div>
    </div>
    <div class="wkgoal">
      <div class="hdr"><b>이번 주</b>
        <span class="num ${wmin>=GOAL?'hit':''}">${wmin>=GOAL?`권장량 달성 · ${wmin}분`:`${wdays}일 · ${wmin}분`}</span></div>
      <div class="days">${bars}</div>
      <div class="gbar"><i style="width:${wpct.toFixed(1)}%"></i></div>
      <p class="fine">${wmin>=GOAL? '권장 150분을 채웠어요. 무리하지 않는 선에서 이어가세요.'
        : `권장 150분까지 ${GOAL-wmin}분 남았어요. 힘든 주는 못 채워도 괜찮아요.`}</p>
    </div>
    <div class="cal">
      <div class="calhd">
        <button class="icon-btn" onclick="shiftMonth(-1)" aria-label="이전 달">${ic('back')}</button>
        <h3>${y}년 ${m+1}월 · ${mdays}일</h3>
        <button class="icon-btn" onclick="shiftMonth(1)" aria-label="다음 달" ${calM>=0?'disabled':''}>${ic('chev')}</button>
      </div>
      <div class="cg">${cells}</div>
    </div>
    ${ent.length?'':`<p class="empty">아직 기록이 없어요.<br>홈에서 오늘의 운동을 하나 골라보세요.</p>`}

let lastFocus=null, ovStack=[], popSelf=false;
function openOv(id){ lastFocus=document.activeElement; $('#'+id).classList.add('on');
  document.body.style.overflow='hidden'; $('#'+id).scrollTop=0;
  ovStack.push(id); history.pushState({ov:id},''); kick(); }
function closeOv(id){ const el=$('#'+id); if(!el.classList.contains('on')) return;
  shutOv(id);
  /* 안드로이드 뒤로가기와 어긋나지 않게, 내가 쌓은 히스토리 항목을 되감는다 */
  if(history.state&&history.state.ov===id){ popSelf=true; history.back(); } }
function shutOv(id){ const el=$('#'+id); el.classList.remove('on');
  ovStack=ovStack.filter(x=>x!==id);
  if(!ovStack.length) document.body.style.overflow='';
  if(id==='ov-player'&&PL){ clearInterval(PL.iv); PL=null; wake(false); }
  if(lastFocus&&lastFocus.focus) lastFocus.focus(); }
/* 뒤로가기(하드웨어/제스처)는 앱을 나가는 대신 열린 시트를 닫는다 */
window.addEventListener('popstate',()=>{
  if(popSelf){ popSelf=false; return; }
  const top=ovStack[ovStack.length-1];
  if($('#ov-ask').classList.contains('on')){ closeAsk(); if(top) history.pushState({ov:top},''); return; }
  if(top) shutOv(top);
});

  const hold=PL&&PL.paused;

    <div class="dt">
      <div class="tags">
        <span class="tag pri">${e.phase.length===3?'전 시기 가능':e.phase.map(p=>PHS[p]).join(' · ')}</span>
        ${e.tags.map(t=>`<span class="tag min">${t}</span>`).join('')}
        <span class="tag cor">${e.min}분 · ${e.reps}</span></div>
      <h1>${e.name}</h1><p class="en">${e.en}</p>
      <div class="box"><b>이런 효과가 있어요</b>${e.effects.map(x=>`<li>${x}</li>`).join('')}</div>
      <div class="steps">${e.steps.map((s,i)=>`<div class="stp"><span class="n">${i+1}</span><span>${s}</span></div>`).join('')}</div>
      <div class="caut">${ic('alert')}<div><b>주의</b>${e.caution}</div></div>
    </div>
    <div class="cta stick"><button class="btn" onclick="startPlayer(['${e.id}'])">
      ${ic('play')}<span>이 동작 시작하기</span></button></div>`;
  openOv('ov-detail');
}
function openPain(id){
  const p=PAINS.find(x=>x.id===id);
  const all=EX.filter(e=>e.pains.includes(id) && !e.load.some(l=>S.avoid.includes(l)));
  const ord={stretch:0,warmup:1,main:2};
  const list=[...all].sort((a,b)=>ord[a.role]-ord[b.role]).slice(0,5);
  const mins=list.reduce((a,e)=>a+e.min,0);
  $('#b-pain').innerHTML=bar('통증 케어',"closeOv('ov-pain')")+`
    <div class="dt" style="padding-top:var(--s2)">
      <h1>${p.name}</h1><p class="en">${p.desc}</p>
      <div class="mini dg">${ic('alert')}<div><b>이럴 땐 운동 말고 병원 먼저</b>${p.hosp}</div></div>
      <div class="mini mn">${ic('shield')}<div><b>생활 속 팁</b>${p.tip}</div></div>
      <div class="mini pr">${ic('flame')}<div><b>운동 전에 이 순서로 풀어보세요</b>
        따뜻하게(온찜질 10~15분) → 아픈 곳을 부드럽게 마사지 → 스트레칭 → 관절을 천천히 움직이기 → 근력 운동.
        <br>단, 부딪히거나 접질려 막 아프기 시작한 곳에는 <b>온찜질 대신 냉찜질</b>을 하세요.</div></div>
      <div class="sect"><h3>완화에 도움되는 동작</h3><span>${list.length}개 · 약 ${mins}분</span></div>
      ${list.length? `<div class="grid">${list.map(e=>`
        <button class="card" onclick="openDetail('${e.id}')" aria-label="${e.name}">
          <span class="pic" aria-hidden="true">${thumb(e)}</span>
          <span class="bd"><b>${e.name}</b><span class="mt">${e.min}분 · ${e.reps}</span></span></button>`).join('')}</div>`
        : `<p class="empty">부담되는 곳 설정으로 추천할 동작이 모두 제외됐어요.<br>케어 탭에서 설정을 조정해보세요.</p>`}
    </div>
    ${list.length?`<div class="cta stick">
      <button class="btn" onclick="startPlayer(${JSON.stringify(list.map(e=>e.id)).replace(/"/g,'&quot;')})">
      ${ic('play')}<span>순서대로 하기 · ${mins}분</span></button></div>`:''}`;
  openOv('ov-pain');
}
function openSafety(){
  $('#b-safety').innerHTML=bar('안전하게 운동하기',"closeOv('ov-safety')")+`
    <div class="sf">
      <div class="warn">${ic('alert')}<div><b>운동을 즉시 멈추고 병원에 연락하세요</b>
        아래 신호 중 하나라도 나타나면 바로 중단하세요.</div></div>
      <ul>
        <li>질 출혈</li><li>운동 전부터 있는 호흡곤란</li><li>어지러움</li><li>두통</li><li>흉통</li>
        <li>근력 약화로 균형이 무너질 때</li><li>종아리 통증이나 한쪽만 붓는 증상 (혈전 의심)</li>
        <li>규칙적으로 반복되는 자궁 수축 (조기진통)</li><li>태동이 눈에 띄게 줄었을 때</li><li>양수가 새는 느낌</li>
      </ul>
      <h4>이런 동작은 피해요</h4>
      <ul>
        <li>임신 20주 이후 등을 대고 오래 눕는 자세</li><li>배를 누르거나 강하게 비트는 동작</li>
        <li>넘어질 위험이 있는 동작, 균형이 크게 흔들리는 자세</li>
        <li>숨을 참고 힘주는 동작(발살바), 뜨거운 환경에서의 운동</li>
        <li>스쿠버다이빙, 고지대(2500m 이상) 운동, 접촉성 스포츠</li>
      </ul>
      <h4>이렇게 움직이세요</h4>
      <ul>
        <li><b>천천히</b> — 반동을 쓰지 않고 근육이 일하는 속도로</li>
        <li><b>힘이 들어가는 걸 느끼며</b> — 어느 근육을 쓰는지 알고 움직이기</li>
        <li><b>일정한 속도로</b> — 올릴 때와 내릴 때를 같은 속도로</li>
        <li><b>조절되는 범위까지만</b> — 통제가 안 되는 범위는 줄이기</li>
      </ul>
      <h4>이 정도가 적당해요</h4>
      <ul>
        <li>주 150분 중강도 — 하루 20~30분씩 주 5일이면 충분해요</li>
        <li>운동하면서 <b>대화할 수 있는 정도</b>의 강도 (노래는 어려운 정도)</li>
        <li>물을 충분히 마시고, 더운 날은 시원한 시간대에</li>
        <li>몸이 힘든 날은 쉬어도 괜찮아요. 무리가 목표가 아니에요</li>
      </ul>
      <p class="src">출처: 미국산부인과학회(ACOG) Committee Opinion 804
        “Physical Activity and Exercise During Pregnancy and the Postpartum Period”(2020),
        영국 NHS 임신 중 운동 지침.<br><br>
        이 앱은 일반적인 정보 제공을 목적으로 하며 의학적 조언을 대신하지 않습니다.
        증상이 있거나 판단이 어려울 때는 담당 의사에게 문의하세요.</p>
    </div>`;
  openOv('ov-safety');
}

/* ═══════════════════════ 플레이어 ═══════════════════════ */
/* 준비 시간은 짧게 — 20분 루틴이 실제로 20분 근처에서 끝나야 한다 (7동작 기준 +75초) */
const PREP=5, REST=10;
const CIRC=2*Math.PI*88;            /* 링 둘레 (r=88) */

/* 타이머는 한 곳(step)에서만 돈다 — 화면을 다시 그려도 인터벌은 하나뿐이다 */
function startPlayer(ids){
  ['ov-detail','ov-pain','ov-routine'].forEach(closeOv);
  const list=ids.map(id=>EX.find(e=>e.id===id)).filter(Boolean);
  if(!list.length) return;
  if(PL) clearInterval(PL.iv);
  PL={list,i:0,rest:true,left:PREP,tot:PREP,paused:false,iv:null};
  openOv('ov-player'); wake(true); drawStep();
  PL.iv=setInterval(step,1000);
}
function step(){
  if(!PL||PL.paused) return;
  PL.left--; paint();
  if(PL.left>0&&PL.left<=3) beep(680,.09,.05);
  if(PL.left<=0) advance();
}
function advance(){
  if(!PL) return;
  if(PL.rest){ PL.rest=false; PL.left=PL.tot=PL.list[PL.i].min*60; cue(940,.2,.09); drawStep(); return; }
  if(PL.i<PL.list.length-1){ PL.i++; PL.rest=true; PL.left=PL.tot=REST; cue(560,.18,.08); drawStep(); }
  else finishPlayer();
}
function skipStep(){ if(!PL) return; PL.left=0; advance(); }
function prevStep(){ if(!PL||PL.i===0) return;
  PL.i--; PL.rest=false; PL.left=PL.tot=PL.list[PL.i].min*60; hap(10); drawStep(); }

const ptop=()=>{ const {list,i,rest}=PL, prog=((i+(rest?0:.5))/list.length*100).toFixed(1);
  return `<div class="ptop">
    <button class="icon-btn" onclick="quitPlayer()" aria-label="운동 종료">${ic('close')}</button>
    <div class="pb"><i style="width:${prog}%"></i></div>
    <div class="pc">${i+1}/${list.length}</div>
    <button class="icon-btn" onclick="toggleMute()" aria-label="${S.mute?'소리 켜기':'소리 끄기'}"
      aria-pressed="${!!S.mute}">${ic(S.mute?'mute':'sound')}</button>
  </div>`; };

function drawStep(){
  const {list,i,rest}=PL, e=list[i];
  if(rest){
    const first=i===0;
    $('#b-player').innerHTML=ptop()+`<div class="restwrap">
      <div class="rest">
        <span class="up">${first?'곧 시작해요':`다음 동작 ${i+1}/${list.length}`}</span>
        <h1>${e.name}</h1>
        <p class="sub">${e.min}분 · ${e.reps}</p>
        <span class="th" aria-hidden="true">${thumb(e)}</span>
        <div class="cd" id="tm">${PL.left}</div>
        <p class="sub">${first?'편한 자리를 잡고 준비하세요':'자세를 바꿀 시간이에요'}</p>
      </div>
      <div class="pctl">
        <button class="icon-btn" onclick="prevStep()" aria-label="이전 동작" ${i===0?'disabled':''}>${ic('prev')}</button>
        <button class="btn sec" id="pz" onclick="togglePause()">${ic('pause')}<span>일시정지</span></button>
        <button class="btn" onclick="skipStep()">${ic('play')}<span>바로 시작</span></button>
      </div></div>`;
    say(`다음 동작, ${e.name}`);
  } else {
    $('#b-player').innerHTML=ptop()+stage(e)+`
      <div class="pnm"><h1>${e.name}</h1><p>${e.reps} · ${e.tags.join(' · ')}</p></div>
      <div class="ring" id="ring">
        <svg viewBox="0 0 200 200" aria-hidden="true">
          <circle class="tr" cx="100" cy="100" r="88"/>
          <circle class="bar" cx="100" cy="100" r="88" stroke-dasharray="${CIRC.toFixed(1)}" stroke-dashoffset="0"/>
        </svg>
        <div class="cn"><div class="t" id="tm">${Math.floor(PL.left/60)}:${pad(PL.left%60)}</div>
          <div class="l">남은 시간</div></div>
      </div>
      <div class="pctl">
        <button class="icon-btn" onclick="prevStep()" aria-label="이전 동작" ${i===0?'disabled':''}>${ic('prev')}</button>
        <button class="btn sec" id="pz" onclick="togglePause()">${ic('pause')}<span>일시정지</span></button>
        <button class="btn" onclick="skipStep()">${i===list.length-1?ic('check')+'<span>완료</span>':ic('skip')+'<span>다음</span>'}</button>
      </div>
      <div style="padding:var(--s5) var(--s4) 0">${e.steps.map((s,n)=>
        `<div class="stp"><span class="n">${n+1}</span><span>${s}</span></div>`).join('')}</div>
      <div style="padding:var(--s4) var(--s4) 0">
        <div class="caut">${ic('alert')}<div><b>주의</b>${e.caution}</div></div></div>`;
    say(`${e.name} 시작. ${e.reps}`);
  }
  $('#ov-player').scrollTop=0; paint(); kick();
  if(PL.paused){ const b=$('#pz'); if(b) b.innerHTML=ic('play')+'<span>이어서 하기</span>';
    const r=$('#ring'); if(r) r.classList.add('pz'); }
}
function paint(){
  if(!PL) return; const el=$('#tm'); if(!el) return;
  el.textContent=PL.rest? String(Math.max(0,PL.left))
    : `${Math.floor(PL.left/60)}:${pad(Math.max(0,PL.left)%60)}`;
  const bar=$('#ring .bar');
  if(bar) bar.style.strokeDashoffset=(CIRC*(1-Math.max(0,PL.left)/PL.tot)).toFixed(1);
  const hot=PL.left<=3;
  const ring=$('#ring'); if(ring) ring.classList.toggle('hot',hot);
  if(PL.rest) el.classList.toggle('hot',hot);
}
function togglePause(){ if(!PL) return; PL.paused=!PL.paused; hap(10);
  const b=$('#pz'); if(b) b.innerHTML=PL.paused? ic('play')+'<span>이어서 하기</span>' : ic('pause')+'<span>일시정지</span>';
  const ring=$('#ring'); if(ring) ring.classList.toggle('pz',PL.paused);
  document.querySelectorAll('#ov-player svg').forEach(s=>{ try{
    PL.paused? s.pauseAnimations() : s.unpauseAnimations() }catch(e){} }); }
function toggleMute(){ S.mute=!S.mute; save(); if(PL) drawStep(); if(!S.mute) beep(880,.1); }

function finishPlayer(){
  clearInterval(PL.iv); PL.iv=null; wake(false);
  const min=PL.list.reduce((a,e)=>a+e.min,0), k=today(), prev=S.done[k];
  S.done[k]={min:(prev?prev.min:0)+min, ids:[...(prev?prev.ids:[]),...PL.list.map(e=>e.id)]};
  save();
  const st=streakN(), n=PL.list.length;
  cue(1046,.24,.09); setTimeout(()=>beep(1318,.3,.08),160);
  $('#b-player').innerHTML=`<div class="fin">
    <div class="em">${ic('check')}</div>
    <h1>오늘 운동 완료!</h1>
    <p>몸과 아기 모두에게 좋은 시간이었어요.</p>
    <div class="sum">
      <div><b>${n}</b><span>동작</span></div>
      <div><b>${min}</b><span>분</span></div>
      <div><b>${st}</b><span>일 연속</span></div>
    </div>
    <div class="cta2">
      <button class="btn" onclick="closeOv('ov-player');go('log')">${ic('log')}<span>기록 보기</span></button>
      <button class="btn sec" onclick="closeOv('ov-player');renderHome();kick()">홈으로</button>
    </div></div>`;
  say(`운동 완료. ${n}개 동작 ${min}분`);
}
function quitPlayer(){
  ask('운동을 그만할까요?','지금 종료하면 이번 운동은 기록에 남지 않아요.','종료하기',
    ()=>closeOv('ov-player'));
}

/* ═══════════════════════ 온보딩 ═══════════════════════ */
function renderOnb(){
  $('#onb').innerHTML=`<div class="ob">
    <div class="ob-art" aria-hidden="true">${rigHero()}</div>
    <h1 id="ob-t">맘핏</h1>
    <p class="lead">주수에 맞춰 집에서 하루 15~30분.<br>몸이 편해지는 운동만 골랐어요.</p>
    <div class="fld" id="fld">
      <label for="due">출산예정일이 언제인가요?</label>
      <input type="date" id="due" value="${S.due||''}" autocomplete="off">
      <p class="help">오늘 기준 주수를 자동으로 계산해요.</p>
      <p class="err" id="due-err" role="alert"></p>
    </div>
    <div class="note">${ic('shield')}<div><b>시작하기 전에</b>
      담당 의사와 상담 후 시작하세요. 이 앱은 일반적인 정보 제공이며 의학적 조언이 아닙니다.
      고위험 임신이거나 의사가 운동을 제한한 경우 따르지 마세요.</div></div>
    <div style="margin-top:auto;padding-top:var(--s5)">
      <button class="btn" onclick="saveDue()">${ic('check')}<span>시작하기</span></button></div>
  </div>`;
  kick();
}
function saveDue(){
  const v=$('#due').value, f=$('#fld'), er=$('#due-err');
  const bad=m=>{ f.classList.add('bad'); er.textContent=m; $('#due').focus(); };
  if(!v) return bad('출산예정일을 선택해주세요.');
  const d=new Date(v+'T00:00:00'); if(isNaN(d)) return bad('날짜 형식을 확인해주세요.');
  const now=new Date(); now.setHours(0,0,0,0);
  const left=Math.round((d-now)/864e5);
  if(left>294) return bad('예정일이 너무 멀어요. 다시 확인해주세요.');
  if(left<-30) return bad('예정일이 너무 지났어요. 다시 확인해주세요.');
  f.classList.remove('bad'); S.due=v; save();
  $('#onb').classList.remove('on'); document.body.style.overflow='';
  /* 기록 탭에서 다시 설정한 경우에도 저장 후에는 홈으로 */
  history.replaceState(null,'','#home');
  boot();
}
function resetDue(){ renderOnb(); $('#onb').classList.add('on'); document.body.style.overflow='hidden'; }

/* ═══════════════════════ 시작 ═══════════════════════ */
document.addEventListener('keydown',e=>{ if(e.key!=='Escape') return;
  if($('#ov-ask').classList.contains('on')) return closeAsk();
  ['ov-player','ov-detail','ov-pain','ov-routine','ov-safety'].forEach(closeOv); });
/* 화면을 벗어나면 타이머를 멈추고, 돌아오면 화면 꺼짐 방지를 다시 건다 */
document.addEventListener('visibilitychange',()=>{
  if(!PL) return;
  if(document.visibilityState==='hidden'){ if(!PL.paused) togglePause(); }
  else wake(true);
});
function boot(){
  const p0=preg(); if(p0) filP=p0.phase;
  tabbar(); renderHome(); renderLib(); renderCare(); renderLog();
  const [k,v]=location.hash.slice(1).split(':');
  if(TABS.some(t=>t[0]===k)) go(k);
  else {
    go('home');   /* 딥링크가 없으면(=가입 직후 포함) 항상 홈부터 */
    if(k==='detail'&&v) openDetail(v);
    else if(k==='pain'&&v) openPain(v);
    else if(k==='routine'&&v) openRoutine(v);
    else if(k==='play'&&v) startPlayer(v.split(','));
    else if(k==='safety') openSafety();
  }
  kick();
}
if(S.due) boot();
else { renderOnb(); $('#onb').classList.add('on'); document.body.style.overflow='hidden'; tabbar(); }
</script>
</body>
</html>
